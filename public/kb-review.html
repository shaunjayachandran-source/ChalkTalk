<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChalkTalk Admin &mdash; KB Review Queue</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0d1017; --card:#161c27; --line:#232b38; --gold:#f0b429;
    --text:#eef1f6; --dim:#8b93a3; --teal:#1abc9c; --danger:#ff5a3c;
    --ok:#27ae60; --ok-dim:#12281c; --link:#7db3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;padding:24px 16px 60px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:.02em;margin-bottom:4px;}
  .sub{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:20px;}
  .wrap{max-width:760px;margin:0 auto;}
  #gate{max-width:360px;margin:80px auto;text-align:center;}
  #gate input{width:100%;padding:10px 12px;background:#0f131c;border:1px solid var(--line);border-radius:6px;color:var(--text);margin-bottom:12px;}
  button{padding:11px 18px;border:none;border-radius:6px;background:var(--gold);color:#0d1017;font-weight:700;font-size:.88rem;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  button.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  button.danger-outline{background:transparent;border:1px solid rgba(255,90,60,.45);color:var(--danger);}
  .stats{display:flex;gap:10px;margin:18px 0 22px;flex-wrap:wrap;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;min-width:110px;}
  .stat .n{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);line-height:1;}
  .stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .card.done{opacity:.5;}
  .card.dismissed{opacity:.45;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .topic{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.01em;line-height:1.1;}
  .pill{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:100px;white-space:nowrap;border:1px solid transparent;}
  .pill.needs_review{background:rgba(255,90,60,.12);color:var(--danger);border-color:rgba(255,90,60,.35);}
  .pill.insufficient_evidence{background:#1b212c;color:var(--dim);border-color:var(--line);}
  .pill.done{background:var(--ok-dim);color:var(--ok);border-color:#1e4430;}
  .pill.dismissed{background:#1b212c;color:var(--dim);border-color:var(--line);}
  .note{font-size:13px;line-height:1.55;margin-top:10px;opacity:.9;}
  .meta{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:8px;}
  .sources{margin-top:14px;}
  .sources-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .src{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;}
  .src.checked{border-color:rgba(240,180,41,.45);}
  .src input[type="checkbox"]{margin-top:3px;flex-shrink:0;width:15px;height:15px;accent-color:var(--gold);}
  .src .body{min-width:0;flex:1;}
  .src a{color:var(--text);text-decoration:none;}
  .src a:hover{color:var(--gold);}
  .src .t{font-size:12.5px;font-weight:600;}
  .src .u{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--link);margin-top:2px;word-break:break-all;}
  .src .q{font-size:11.5px;color:var(--dim);margin-top:4px;font-style:italic;line-height:1.4;}
  .empty{color:var(--dim);font-size:.9rem;padding:30px 0;text-align:center;}
  .refresh{margin-bottom:16px;}
  .refresh button{background:transparent;border:1px solid var(--line);color:var(--text);}
  .form{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .field{flex:1;min-width:140px;}
  .field label{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%;padding:8px 10px;background:#0f131c;border:1px solid var(--line);border-radius:6px;color:var(--text);
    font-family:'DM Sans',sans-serif;font-size:13px;
  }
  .field textarea{resize:vertical;min-height:56px;line-height:1.4;}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .status-msg{font-family:'DM Mono',monospace;font-size:11px;margin-top:8px;}
  .status-msg.ok{color:var(--ok);}
  .status-msg.err{color:var(--danger);}
</style>
</head>
<body>

<div id="gate">
  <h1>ChalkTalk Admin</h1>
  <div class="sub">Enter admin token to continue</div>
  <input type="text" id="tokenInput" placeholder="Admin token">
  <button id="unlockBtn" style="width:100%;">Unlock</button>
  <div id="gateMsg"></div>
</div>

<div id="app" style="display:none;">
  <div class="wrap">
    <h1>KB Review Queue</h1>
    <div class="sub">Topics the auto-research cron couldn't clear on its own &middot; approve straight into the knowledge base, no SQL</div>

    <div class="stats" id="stats"></div>
    <div class="refresh"><button id="refreshBtn">Refresh</button></div>
    <div id="list" class="empty">Loading&hellip;</div>
  </div>
</div>

<script>
(function(){
  var TOKEN_KEY = 'chalktalk_admin_token';
  function getToken(){ return sessionStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t){ sessionStorage.setItem(TOKEN_KEY, t); }

  function apiCall(path, options){
    options = options || {};
    options.headers = Object.assign({
      'Authorization': 'Bearer ' + getToken(),
      'Content-Type': 'application/json',
    }, options.headers || {});
    return fetch(path, options).then(function(res){
      return res.json().then(function(body){
        if(!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
        return body;
      });
    });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(s){
    return escapeHtml(s).replace(/"/g,'&quot;');
  }

  function showApp(){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadQueue();
  }

  function tryUnlock(token){
    setToken(token);
    apiCall('/api/kb-review-queue').then(function(){
      showApp();
    }).catch(function(err){
      document.getElementById('gateMsg').innerHTML = '<div style="color:var(--danger);margin-top:8px;">' + escapeHtml(err.message) + '</div>';
      sessionStorage.removeItem(TOKEN_KEY);
    });
  }

  document.getElementById('unlockBtn').addEventListener('click', function(){
    var t = document.getElementById('tokenInput').value.trim();
    if(!t) return;
    tryUnlock(t);
  });
  if(getToken()){ tryUnlock(getToken()); }

  document.getElementById('refreshBtn').addEventListener('click', loadQueue);

  function renderStats(pending){
    var needsReview = pending.filter(function(p){ return p.outcome === 'needs_review' && !p.alreadyInKb && !p.dismissed; }).length;
    var insufficient = pending.filter(function(p){ return p.outcome === 'insufficient_evidence' && !p.alreadyInKb && !p.dismissed; }).length;
    var resolved = pending.filter(function(p){ return p.alreadyInKb; }).length;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="n">' + needsReview + '</div><div class="l">Needs review</div></div>' +
      '<div class="stat"><div class="n">' + insufficient + '</div><div class="l">Insufficient evidence</div></div>' +
      '<div class="stat"><div class="n">' + resolved + '</div><div class="l">Already added</div></div>';
  }

  // Each source checkbox carries its own url/title/cited_text via data
  // attributes so "which links get approved vs. ignored" is a real
  // per-source decision read straight out of the DOM at submit time --
  // nothing here assumes all-or-nothing.
  function sourceRow(cardId, s, idx){
    if(!s || !s.url) return '';
    var id = cardId + '-src-' + idx;
    return '<div class="src checked">' +
      '<input type="checkbox" id="' + id + '" checked ' +
        'data-url="' + escapeAttr(s.url) + '" data-title="' + escapeAttr(s.title || '') + '" data-quote="' + escapeAttr(s.cited_text || '') + '">' +
      '<label class="body" for="' + id + '">' +
        '<a href="' + encodeURI(s.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
          (s.title ? '<div class="t">' + escapeHtml(s.title) + '</div>' : '') +
          '<div class="u">' + escapeHtml(s.url) + '</div>' +
        '</a>' +
        (s.cited_text ? '<div class="q">&ldquo;' + escapeHtml(s.cited_text) + '&rdquo;</div>' : '') +
      '</label>' +
    '</div>';
  }

  function reviewForm(p){
    var cardId = 'card-' + p.runId;
    var st = p.structure || {};
    var sourcesHtml = (p.sources || []).map(function(s, i){ return sourceRow(cardId, s, i); }).join('');
    return '<div class="form" id="' + cardId + '-form">' +
      '<div class="row">' +
        '<div class="field"><label>System name</label><input id="' + cardId + '-name" value="' + escapeAttr(p.systemName || p.topic || '') + '"></div>' +
        '<div class="field"><label>Category</label><select id="' + cardId + '-category">' +
          '<option value="offense"' + (p.category === 'offense' ? ' selected' : '') + '>Offense</option>' +
          '<option value="defense"' + (p.category === 'defense' ? ' selected' : '') + '>Defense</option>' +
        '</select></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Formation</label><input id="' + cardId + '-formation" value="' + escapeAttr(p.formation || '') + '" placeholder="e.g. 4-out 1-in"></div>' +
        '<div class="field"><label>Coaching level</label><select id="' + cardId + '-level">' +
          ['', 'youth', 'high-school', 'college', 'pro'].map(function(lv){
            return '<option value="' + lv + '"' + (p.coachingLevel === lv ? ' selected' : '') + '>' + (lv || '&mdash;') + '</option>';
          }).join('') +
        '</select></div>' +
        '<div class="field"><label>Aliases (comma-separated)</label><input id="' + cardId + '-aliases" value="' + escapeAttr((p.aliases || []).join(', ')) + '"></div>' +
      '</div>' +
      '<div class="field" style="margin-bottom:10px;"><label>Summary</label><textarea id="' + cardId + '-summary">' + escapeHtml(p.summary || '') + '</textarea></div>' +
      '<div class="row">' +
        '<div class="field"><label>Personnel</label><textarea id="' + cardId + '-personnel">' + escapeHtml(st.personnel || '') + '</textarea></div>' +
        '<div class="field"><label>Key action</label><textarea id="' + cardId + '-keyaction">' + escapeHtml(st.key_action || '') + '</textarea></div>' +
        '<div class="field"><label>Variations</label><textarea id="' + cardId + '-variations">' + escapeHtml(st.common_variations || '') + '</textarea></div>' +
      '</div>' +
      (sourcesHtml ? '<div class="sources"><div class="sources-label">Sources &mdash; check the ones to keep, uncheck to leave out</div>' + sourcesHtml + '</div>'
                    : '<div class="sources"><div class="sources-label">No sources reported &mdash; approving will add this as a source-free entry (fine for a formation-only topic)</div></div>') +
      '<div class="actions">' +
        '<button data-run-approve="' + p.runId + '">Approve &amp; add to KB</button>' +
        '<button class="danger-outline" data-run-reject="' + p.runId + '">Dismiss (don&rsquo;t add)</button>' +
      '</div>' +
      '<div class="status-msg" id="' + cardId + '-status"></div>' +
    '</div>';
  }

  function renderCard(p){
    var pillClass = p.alreadyInKb ? 'done' : (p.dismissed ? 'dismissed' : p.outcome);
    var pillLabel = p.alreadyInKb ? 'already added' : (p.dismissed ? 'dismissed' : p.outcome.replace(/_/g, ' '));
    var needsForm = !p.alreadyInKb && !p.dismissed;
    return '<div class="card' + (p.alreadyInKb ? ' done' : '') + (p.dismissed ? ' dismissed' : '') + '" data-card="' + p.runId + '">' +
      '<div class="card-head">' +
        '<div class="topic">' + escapeHtml(p.topic || p.systemName || 'Unknown topic') + '</div>' +
        '<div class="pill ' + pillClass + '">' + escapeHtml(pillLabel) + '</div>' +
      '</div>' +
      '<div class="note">' + escapeHtml(p.notes || '') + '</div>' +
      '<div class="meta">' + new Date(p.createdAt).toLocaleString() + (p.requestedBy ? ' &middot; requested by ' + escapeHtml(p.requestedBy) : '') + '</div>' +
      (needsForm ? reviewForm(p) : '') +
    '</div>';
  }

  var currentPending = [];

  function findPending(runId){
    return currentPending.filter(function(p){ return String(p.runId) === String(runId); })[0];
  }

  function collectCheckedSources(cardId){
    var boxes = document.querySelectorAll('#' + cardId + '-form .src input[type="checkbox"]');
    var out = [];
    boxes.forEach(function(box){
      if(box.checked){
        out.push({ url: box.getAttribute('data-url'), title: box.getAttribute('data-title') || null, cited_text: box.getAttribute('data-quote') || null });
      }
      box.closest('.src').classList.toggle('checked', box.checked);
    });
    return out;
  }

  function wireCard(p){
    var cardId = 'card-' + p.runId;
    var cardEl = document.querySelector('[data-card="' + p.runId + '"]');
    if(!cardEl) return;

    cardEl.querySelectorAll('.src input[type="checkbox"]').forEach(function(box){
      box.addEventListener('change', function(){
        box.closest('.src').classList.toggle('checked', box.checked);
      });
    });

    var statusEl = document.getElementById(cardId + '-status');
    var approveBtn = cardEl.querySelector('[data-run-approve="' + p.runId + '"]');
    var rejectBtn = cardEl.querySelector('[data-run-reject="' + p.runId + '"]');

    if(approveBtn){
      approveBtn.addEventListener('click', function(){
        var sources = collectCheckedSources(cardId);
        var aliasesRaw = document.getElementById(cardId + '-aliases').value;
        var payload = {
          action: 'approve',
          queueId: p.queueId,
          slug: p.normalizedSlug,
          systemName: document.getElementById(cardId + '-name').value.trim(),
          category: document.getElementById(cardId + '-category').value,
          formation: document.getElementById(cardId + '-formation').value.trim() || null,
          coachingLevel: document.getElementById(cardId + '-level').value || null,
          aliases: aliasesRaw ? aliasesRaw.split(',').map(function(a){ return a.trim(); }).filter(Boolean) : [],
          summary: document.getElementById(cardId + '-summary').value.trim(),
          structure: {
            personnel: document.getElementById(cardId + '-personnel').value.trim(),
            key_action: document.getElementById(cardId + '-keyaction').value.trim(),
            common_variations: document.getElementById(cardId + '-variations').value.trim(),
          },
          sources: sources,
        };
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        statusEl.className = 'status-msg';
        statusEl.textContent = 'Saving…';
        apiCall('/api/kb-review-approve', { method: 'POST', body: JSON.stringify(payload) }).then(function(result){
          statusEl.className = 'status-msg ok';
          statusEl.textContent = 'Added to the knowledge base with ' + result.sourceCount + ' source' + (result.sourceCount === 1 ? '' : 's') + '.';
          setTimeout(loadQueue, 900);
        }).catch(function(err){
          approveBtn.disabled = false;
          rejectBtn.disabled = false;
          statusEl.className = 'status-msg err';
          statusEl.textContent = err.message;
        });
      });
    }

    if(rejectBtn){
      rejectBtn.addEventListener('click', function(){
        if(!confirm('Dismiss "' + (p.topic || p.systemName) + '" without adding it to the knowledge base?')) return;
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        statusEl.className = 'status-msg';
        statusEl.textContent = 'Saving…';
        apiCall('/api/kb-review-approve', { method: 'POST', body: JSON.stringify({ action: 'reject', queueId: p.queueId }) }).then(function(){
          statusEl.className = 'status-msg ok';
          statusEl.textContent = 'Dismissed.';
          setTimeout(loadQueue, 900);
        }).catch(function(err){
          approveBtn.disabled = false;
          rejectBtn.disabled = false;
          statusEl.className = 'status-msg err';
          statusEl.textContent = err.message;
        });
      });
    }
  }

  function loadQueue(){
    var list = document.getElementById('list');
    list.innerHTML = 'Loading&hellip;';
    apiCall('/api/kb-review-queue').then(function(result){
      var pending = result.pending || [];
      currentPending = pending;
      renderStats(pending);
      if(!pending.length){
        list.innerHTML = '<div class="empty">Nothing pending right now &mdash; the review queue is clear.</div>';
        return;
      }
      var open = pending.filter(function(p){ return !p.alreadyInKb && !p.dismissed; });
      var resolved = pending.filter(function(p){ return p.alreadyInKb || p.dismissed; });
      list.innerHTML = open.map(renderCard).join('') + resolved.map(renderCard).join('');
      open.forEach(wireCard);
    }).catch(function(err){
      list.innerHTML = '<div style="color:var(--danger);">' + escapeHtml(err.message) + '</div>';
    });
  }
})();
</script>
</body>
</html>
