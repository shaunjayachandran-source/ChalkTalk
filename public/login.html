<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChalkTalk — Coach Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d1017;
    --gold: #f0b429;
    --gold-stroke: #ffd060;
    --text: #e8e6e0;
    --muted: #8b93a1;
    --card: #151a24;
    --border: #262d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: 34px;
    color: var(--gold);
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 13px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0d1017;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px;
    background: var(--gold);
    color: #0d1017;
    border: none;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg {
    margin-top: 14px;
    font-size: 13px;
    min-height: 18px;
  }
  #msg.error { color: #ff7b6e; }
  #msg.info { color: var(--muted); }
  #mfa-msg.error { color: #ff7b6e; }
  #forgot-msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
  #forgot-msg.error, #reset-msg.error { color: #ff7b6e; }
  #forgot-msg.info { color: var(--muted); }

  /* Password field with show/hide eye (Sep 25, 2026). The global button
     rule above styles every <button> as a full-width gold bar, so the eye
     and the text-link buttons explicitly undo that. */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 46px; }
  button.eye {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; margin: 0; padding: 0;
    background: transparent; border: none; border-radius: 6px;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
  }
  button.eye:hover, button.eye:focus-visible { color: var(--gold); outline: none; }
  button.eye svg { width: 20px; height: 20px; }
  button.link-btn {
    width: auto; margin: 12px 0 0; padding: 0; background: none; border: none;
    color: var(--muted); font-size: 12px; font-weight: 400; text-decoration: underline;
  }
  button.link-btn:hover { color: var(--gold); }
</style>
<script>
  // Captured before supabase-js parses and clears the URL fragment, so
  // the page can tell an invite / recovery / expired link apart from a
  // normal visit. See the INVITE FLOW note in the module script below.
  window.__ctAuthHash = window.location.hash || "";
</script>
</head>
<body>
  <form class="card" id="login-form">
    <h1>ChalkTalk</h1>
    <p class="sub">Coach login</p>

    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email" />

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="button" class="eye" data-target="password" aria-label="Show password" aria-pressed="false"></button>
    </div>

    <button type="submit" id="submit-btn">Log in</button>
    <button type="button" class="link-btn" id="forgot-link">Forgot password?</button>
    <div id="msg"></div>
  </form>

  <!-- Forgot password (Sep 25, 2026). Sends a Supabase reset email whose
       link lands back on this page with #type=recovery, which the existing
       set-password form below already handles. Also the self-serve way in
       for any coach who used an invite before the invite fix and so never
       set a password. -->
  <form class="card" id="forgot-form" style="display:none;">
    <h1>ChalkTalk</h1>
    <p class="sub">Reset your password</p>

    <label for="forgot-email">Email</label>
    <input type="email" id="forgot-email" required autocomplete="email" />

    <button type="submit" id="forgot-submit-btn">Email me a reset link</button>
    <button type="button" class="link-btn" id="back-to-login">&larr; Back to log in</button>
    <div id="forgot-msg"></div>
  </form>

  <!-- Shown instead of the login form when the coach arrives here via a
       Supabase "reset password" or "magic link" email. Those links carry a
       recovery token in the URL that supabase-js picks up automatically and
       fires a PASSWORD_RECOVERY auth event for -- this is the landing page
       that lets them actually set a new password once that happens. -->
  <form class="card" id="reset-form" style="display:none;">
    <h1>ChalkTalk</h1>
    <p class="sub" id="reset-sub">Set a new password</p>

    <label for="new-password">New password</label>
    <div class="pw-wrap">
      <input type="password" id="new-password" required autocomplete="new-password" minlength="6" />
      <button type="button" class="eye" data-target="new-password" aria-label="Show password" aria-pressed="false"></button>
    </div>

    <label for="confirm-password">Confirm password</label>
    <div class="pw-wrap">
      <input type="password" id="confirm-password" required autocomplete="new-password" minlength="6" />
      <button type="button" class="eye" data-target="confirm-password" aria-label="Show password" aria-pressed="false"></button>
    </div>

    <button type="submit" id="reset-submit-btn">Save new password</button>
    <div id="reset-msg"></div>
  </form>

  <!-- Shown after a correct password when the account has 2FA enabled
       (Sep 15, 2026 -- optional per-coach, set up from the dashboard's
       Security card). Supabase already has a real password-verified
       session at this point (AAL1) -- this form just completes the second
       factor to reach AAL2 before goPostLogin() is allowed to proceed. -->
  <form class="card" id="mfa-form" style="display:none;">
    <h1>ChalkTalk</h1>
    <p class="sub">Enter your 6-digit code</p>

    <label for="mfa-code">Authenticator code</label>
    <input type="text" id="mfa-code" required maxlength="6" autocomplete="one-time-code" inputmode="numeric" />

    <button type="submit" id="mfa-submit-btn">Verify</button>
    <div id="mfa-msg"></div>
  </form>

  <script type="module">
    import { supabase } from "/js/supabase-client.js";

    const loginForm = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit-btn");

    const resetForm = document.getElementById("reset-form");
    const resetMsg = document.getElementById("reset-msg");
    const resetBtn = document.getElementById("reset-submit-btn");

    const mfaForm = document.getElementById("mfa-form");
    const mfaMsg = document.getElementById("mfa-msg");
    const mfaSubmitBtn = document.getElementById("mfa-submit-btn");
    let mfaPendingDefaultUrl = null;

    function showResetForm() {
      loginForm.style.display = "none";
      forgotForm.style.display = "none";
      resetForm.style.display = "block";
    }

    // ---- Show/hide password eye ----
    const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_SHUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    document.querySelectorAll("button.eye").forEach((eyeBtn) => {
      eyeBtn.innerHTML = EYE_OPEN;
      eyeBtn.addEventListener("click", () => {
        const input = document.getElementById(eyeBtn.dataset.target);
        const reveal = input.type === "password";
        input.type = reveal ? "text" : "password";
        eyeBtn.innerHTML = reveal ? EYE_SHUT : EYE_OPEN;
        eyeBtn.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
        eyeBtn.setAttribute("aria-pressed", String(reveal));
        input.focus();
      });
    });

    // ---- Forgot password ----
    const forgotForm = document.getElementById("forgot-form");
    const forgotMsg = document.getElementById("forgot-msg");
    const forgotBtn = document.getElementById("forgot-submit-btn");

    function showForgotForm() {
      document.getElementById("forgot-email").value = document.getElementById("email").value.trim();
      forgotMsg.textContent = "";
      forgotMsg.className = "";
      loginForm.style.display = "none";
      forgotForm.style.display = "block";
    }
    document.getElementById("forgot-link").addEventListener("click", showForgotForm);
    document.getElementById("back-to-login").addEventListener("click", () => {
      forgotForm.style.display = "none";
      loginForm.style.display = "block";
    });

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      forgotMsg.textContent = "";
      forgotMsg.className = "";
      forgotBtn.disabled = true;
      forgotBtn.textContent = "Sending...";
      const email = document.getElementById("forgot-email").value.trim();
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/login.html",
      });
      forgotBtn.disabled = false;
      forgotBtn.textContent = "Email me a reset link";
      if (error) {
        // Usually Supabase's per-address cooldown ("you can only request
        // this after N seconds") -- worth showing as-is.
        forgotMsg.textContent = error.message;
        forgotMsg.className = "error";
        return;
      }
      // Same message whether or not the address has an account, so this
      // form can't be used to probe which emails are registered.
      forgotMsg.textContent = "If that email has a ChalkTalk account, a reset link is on its way. Check your spam or promotions folder if it doesn't show up in a few minutes.";
      forgotMsg.className = "info";
    });

    // INVITE FLOW (fixed Sep 25, 2026): an invite email's link lands here
    // with #...type=invite and a real session, but supabase-js fires
    // SIGNED_IN for it, not PASSWORD_RECOVERY -- so previously an invited
    // coach was sent straight to the dashboard WITHOUT ever setting a
    // password, and had no way back in next time. Invite links now get the
    // same set-password form as recovery links, with welcome wording.
    const authHash = window.__ctAuthHash || window.location.hash || "";
    const hashParams = new URLSearchParams(authHash.replace(/^#/, ""));
    const linkType = hashParams.get("type");
    const isInviteLink = linkType === "invite" || linkType === "signup";
    const isRecoveryLink = linkType === "recovery";
    const linkError = hashParams.get("error_code") || hashParams.get("error");

    function showInviteForm() {
      document.getElementById("reset-sub").textContent = "Welcome! Choose a password to finish setting up your account.";
      document.getElementById("reset-submit-btn").textContent = "Save password & continue";
      showResetForm();
    }

    if (linkError) {
      // Most common case: the invite / reset link expired (they're
      // single-use and time-limited) -- say so instead of silently showing
      // a login form the person has no password for.
      msg.className = "error";
      msg.textContent =
        linkError === "otp_expired"
          ? "That link has expired. Use \"Forgot password?\" below to get a fresh one, or reply to your invite email and we'll resend it."
          : "That link didn't work: " + (hashParams.get("error_description") || linkError).replace(/\+/g, " ");
    } else if (isInviteLink) {
      showInviteForm();
    }

    function showMfaForm(defaultUrl) {
      mfaPendingDefaultUrl = defaultUrl;
      loginForm.style.display = "none";
      mfaForm.style.display = "block";
    }

    // Coach-tier MFA (Sep 15, 2026, optional -- set up from the dashboard's
    // Security card). A correct password alone only reaches Supabase's AAL1;
    // if the account has a verified TOTP factor, Supabase's own
    // getAuthenticatorAssuranceLevel() reports a `nextLevel` of aal2, which
    // this gate catches and asks for the 6-digit code before letting
    // goPostLogin() proceed. An account with no factor enrolled has
    // nextLevel === currentLevel and skips straight through, unchanged
    // from before this feature existed.
    async function proceedPastMfaGate(defaultUrl) {
      const { data, error } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
      if (error) {
        // Fail open to the normal landing rather than stranding a coach on
        // a blank screen over an MFA-status check failure -- RLS/session
        // validity is still enforced everywhere else regardless.
        await goPostLogin(defaultUrl);
        return;
      }
      if (data.nextLevel === "aal2" && data.currentLevel !== "aal2") {
        showMfaForm(defaultUrl);
        return;
      }
      await goPostLogin(defaultUrl);
    }

    // Deep-link-back after login (Sep 15, 2026): if the coach arrived here
    // from a public team page's "This play is private" modal, that modal
    // stashed the clicked play's id in sessionStorage before navigating
    // (see showAccessModal() in chalk-team-common.js). Once we have a real
    // session, try opening that exact play via api/view-play.js instead of
    // just landing on the dashboard -- same fetch-into-a-blank-tab-free
    // approach as create.html, but replacing THIS tab since we're already
    // mid-navigation here. Falls back to the normal dashboard landing on
    // any failure (wrong program, play deleted, storage blocked, etc.) so
    // a stale/bad pending id never strands the coach on a blank page.
    async function goPostLogin(defaultUrl) {
      let pendingPlayId = null;
      try {
        pendingPlayId = sessionStorage.getItem("ct_pending_play_id");
      } catch (err) {}

      if (pendingPlayId) {
        try {
          sessionStorage.removeItem("ct_pending_play_id");
        } catch (err) {}
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          try {
            const res = await fetch(`/api/view-play?playId=${encodeURIComponent(pendingPlayId)}`, {
              headers: { Authorization: `Bearer ${session.access_token}` },
            });
            if (res.ok) {
              const html = await res.text();
              document.open();
              document.write(html);
              document.close();
              return;
            }
          } catch (err) {
            // Fall through to the default landing below.
          }
        }
      }

      window.location.href = defaultUrl;
    }

    // Supabase fires this when the URL contains a valid recovery/magic-link
    // token (it parses the URL itself -- we don't need to touch location.hash).
    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        showResetForm();
      } else if (event === "SIGNED_IN" && isInviteLink) {
        showInviteForm();
      }
    });

    // If already logged in with a normal session (not a recovery link),
    // skip straight to the dashboard (or a pending play -- see
    // goPostLogin). Recovery sessions are handled above instead, so check
    // the URL for that first.
    if (!isRecoveryLink && !isInviteLink) {
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) proceedPastMfaGate("/dashboard.html");
      });
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        msg.textContent = /invalid login credentials/i.test(error.message)
          ? "That email and password don't match. Forgot it, or never set one? Use \"Forgot password?\" above."
          : error.message;
        msg.className = "error";
        btn.disabled = false;
        btn.textContent = "Log in";
        return;
      }

      await proceedPastMfaGate("/dashboard.html");
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      resetMsg.textContent = "";
      resetMsg.className = "";

      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword !== confirmPassword) {
        resetMsg.textContent = "Passwords don't match.";
        resetMsg.className = "error";
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = "Saving...";

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        resetMsg.textContent = error.message;
        resetMsg.className = "error";
        resetBtn.disabled = false;
        resetBtn.textContent = isInviteLink ? "Save password & continue" : "Save new password";
        return;
      }

      await proceedPastMfaGate("/dashboard.html");
    });

    mfaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      mfaMsg.textContent = "";
      mfaMsg.className = "";
      const code = document.getElementById("mfa-code").value.trim();
      if (!code) return;

      mfaSubmitBtn.disabled = true;
      mfaSubmitBtn.textContent = "Verifying...";

      const { data: factors, error: factorsErr } = await supabase.auth.mfa.listFactors();
      const factor = factorsErr ? null : (factors.totp || []).find((f) => f.status === "verified");
      if (!factor) {
        mfaMsg.textContent = "Couldn't find your 2FA setup. Try logging in again.";
        mfaMsg.className = "error";
        mfaSubmitBtn.disabled = false;
        mfaSubmitBtn.textContent = "Verify";
        return;
      }

      const { data: challenge, error: challengeErr } = await supabase.auth.mfa.challenge({ factorId: factor.id });
      if (challengeErr) {
        mfaMsg.textContent = challengeErr.message;
        mfaMsg.className = "error";
        mfaSubmitBtn.disabled = false;
        mfaSubmitBtn.textContent = "Verify";
        return;
      }

      const { error: verifyErr } = await supabase.auth.mfa.verify({
        factorId: factor.id,
        challengeId: challenge.id,
        code,
      });

      if (verifyErr) {
        mfaMsg.textContent = "That code didn't work -- check your authenticator app's current code and try again.";
        mfaMsg.className = "error";
        mfaSubmitBtn.disabled = false;
        mfaSubmitBtn.textContent = "Verify";
        return;
      }

      await goPostLogin(mfaPendingDefaultUrl || "/dashboard.html");
    });
  </script>
</body>
</html>
